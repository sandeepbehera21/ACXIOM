spring.application.name=acxiomcrm

# ---------------------------------------------------------------- database --
# Credentials come from environment variables so that no password is ever
# committed to source control (specification §14: "Database credentials stored
# securely and not hard-coded in source control").
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acxiomcrm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:acxiom}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------- jpa --
# update = create missing tables/columns without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---------------------------------------------------------------------- server --
server.port=8080
# Send the session cookie to the React dev server and allow axios to read the
# CSRF cookie. SameSite=Lax is safe because the frontend and backend share the
# "localhost" site.
server.servlet.session.cookie.name=ACXIOMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# -------------------------------------------------------------------- security --
# Password policy (specification §6.2)
acxiom.security.password.min-length=8
# Failed-login lockout (specification §6.3). The specification defers both
# values to configuration, so they are explicit here rather than magic numbers.
acxiom.security.lockout.max-failed-attempts=5
acxiom.security.lockout.duration-minutes=15

# ----------------------------------------------------------------------- cors --
# The React dev server origin. Must be explicit (not "*") because credentials
# are sent with every request.
acxiom.cors.allowed-origin=http://localhost:5173

# --------------------------------------------------------------------- logging --
# Never log SQL parameters: they can contain email addresses and phone numbers.
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=info
