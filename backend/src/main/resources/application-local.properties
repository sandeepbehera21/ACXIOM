# Local development profile (runs instantly with in-memory H2 in MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:acxiomcrm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

acxiom.security.password.min-length=8
acxiom.security.lockout.max-failed-attempts=5
acxiom.security.lockout.duration-minutes=15
acxiom.cors.allowed-origin=http://localhost:5173
