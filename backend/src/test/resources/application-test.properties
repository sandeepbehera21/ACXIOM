# Test-only datasource.
#
# The automated tests run against an in-memory H2 database in MySQL compatibility
# mode so that the business rules, validation rules and security rules can be
# verified without a live MySQL instance. The application's real configuration
# (src/main/resources/application.properties) is unchanged and points at MySQL.
#
# MySQL mode matters: it makes H2 accept MySQL-style column types and identifier
# case rules, so an entity that maps cleanly here is unlikely to surprise us on
# MySQL. It is a close approximation, not a substitute - the MySQL run is still
# required before Phase 1 can be signed off.
spring.datasource.url=jdbc:h2:mem:acxiomcrm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

acxiom.security.password.min-length=8
acxiom.security.lockout.max-failed-attempts=5
acxiom.security.lockout.duration-minutes=15
acxiom.cors.allowed-origin=http://localhost:5173
